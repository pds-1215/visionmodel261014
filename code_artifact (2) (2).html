<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Porsche Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Orbitron', sans-serif; /* 미래지향적인 폰트 적용 */
            overflow: hidden;
            touch-action: none; /* 모바일 스크롤 방지 */
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 클릭 이벤트가 캔버스로 전달되도록 함 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #score-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }
        
        /* 버튼 스타일링 */
        .btn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Orbitron', sans-serif;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
        }

        .brand-text {
            letter-spacing: 4px;
            color: #cbd5e1;
            font-size: 1.2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="ui-layer">
            <div class="hud">
                <div id="score-display">SCORE: 0</div>
                <div class="text-xs text-slate-400 font-bold tracking-widest">PORSCHE</div>
            </div>
            
            <!-- 모바일 컨트롤 힌트 -->
            <div class="flex justify-between px-4 pb-8 opacity-30 text-xs font-bold tracking-widest">
                <span>&lt; TAP</span>
                <span>TAP &gt;</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">PORSCHE</h1>
            <h2 class="text-2xl font-bold text-red-500 mb-8 tracking-widest shadow-red-500">RACING</h2>
            <p class="text-sm text-gray-300 mb-8 text-center px-6">
                Use <span class="text-white font-bold">Left/Right Arrows</span><br>or <span class="text-white font-bold">Tap screen sides</span> to steer.
            </p>
            <button id="start-btn" class="btn">START ENGINE</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="text-3xl font-black text-red-500 mb-2">CRASHED!</h2>
            <div class="text-xl text-gray-300 mb-8">FINAL SCORE: <span id="final-score" class="text-white font-bold">0</span></div>
            <button id="restart-btn" class="btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 게임 상태
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let gameSpeed = 5;
        let lineOffset = 0;
        let animationId;

        // 차량 설정 (포르쉐 스타일)
        const car = {
            width: 44,
            height: 80,
            x: 0,
            y: 0,
            speed: 7,
            color: '#dc2626', // 날렵한 레드
            targetX: 0
        };

        // 장애물 배열
        let obstacles = [];
        let particles = [];

        // 캔버스 크기 조정
        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            if (gameState === 'START') {
                car.x = canvas.width / 2 - car.width / 2;
                car.targetX = car.x;
                car.y = canvas.height - car.height - 40;
            }
        }
        window.addEventListener('resize', resize);

        function drawCar(x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);

            // 타이어 그림자
            ctx.fillStyle = '#000';
            ctx.fillRect(-2, 10, 6, 20);
            ctx.fillRect(w - 4, 10, 6, 20);
            ctx.fillRect(-2, h - 30, 6, 20);
            ctx.fillRect(w - 4, h - 30, 6, 20);

            // 차체 (유선형 메인 바디)
            ctx.fillStyle = car.color;
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, [15, 15, 10, 10]);
            ctx.fill();

            // 디테일 셰이딩 (입체감)
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.roundRect(w/2, 0, w/2, h, [0, 15, 10, 0]);
            ctx.fill();

            // 앞 유리
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(5, 20, w - 10, 25, [5, 5, 2, 2]);
            ctx.fill();
            
            // 뒷 유리
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(8, h - 25, w - 16, 15, [2, 2, 0, 0]);
            ctx.fill();

            // 헤드라이트
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.ellipse(8, 8, 4, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(w - 8, 8, 4, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 헤드라이트 빛 효과
            ctx.fillStyle = 'rgba(253, 224, 71, 0.4)';
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(-10, -40);
            ctx.lineTo(20, -40);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w-4, 0);
            ctx.lineTo(w-20, -40);
            ctx.lineTo(w+10, -40);
            ctx.fill();

            // 루프 라인
            ctx.strokeStyle = '#991b1b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(10, h - 25);
            ctx.moveTo(w - 10, 20);
            ctx.lineTo(w - 10, h - 25);
            ctx.stroke();

            ctx.restore();
        }

        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            
            // 장애물 차체 (어두운 회색/파란색 톤)
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.roundRect(0, 0, obs.width, obs.height, 5);
            ctx.fill();
            
            // 앞/뒷 유리
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(4, 15, obs.width - 8, 20);
            ctx.fillRect(6, obs.height - 20, obs.width - 12, 10);
            
            // 후미등 (빨간색)
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(2, obs.height - 4, 10, 4);
            ctx.fillRect(obs.width - 12, obs.height - 4, 10, 4);

            ctx.restore();
        }

        function drawRoad() {
            // 아스팔트 배경
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 도로 경계선
            ctx.fillStyle = '#64748b';
            ctx.fillRect(15, 0, 5, canvas.height);
            ctx.fillRect(canvas.width - 20, 0, 5, canvas.height);

            // 중앙 차선 (애니메이션)
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -lineOffset;
            
            const numLanes = 3;
            const laneWidth = canvas.width / numLanes;
            
            for(let i = 1; i < numLanes; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }
            
            ctx.setLineDash([]); // 초기화
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            particles = [];
            car.x = canvas.width / 2 - car.width / 2;
            car.targetX = car.x;
            car.y = canvas.height - car.height - 40;
            scoreDisplay.innerText = `SCORE: ${Math.floor(score)}`;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            gameState = 'PLAYING';
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function spawnObstacle() {
            const laneWidth = canvas.width / 3;
            // 3개의 차선 중 하나 선택
            const lane = Math.floor(Math.random() * 3);
            const obsWidth = 44;
            const obsHeight = 85;
            
            // 차선 중앙에 배치
            const x = (lane * laneWidth) + (laneWidth / 2) - (obsWidth / 2);
            
            // 겹치지 않게 거리 유지 검사
            const isSafe = obstacles.every(obs => obs.y > 150);
            
            if(isSafe) {
                obstacles.push({
                    x: x,
                    y: -obsHeight,
                    width: obsWidth,
                    height: obsHeight,
                    speed: Math.random() * 2 + (gameSpeed * 0.5) // 주변 차량 속도 다양화
                });
            }
        }

        function createExplosion(x, y) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x: x + car.width/2,
                    y: y + car.height/2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ef4444' : '#f59e0b'
                });
            }
        }

        let lastTime = 0;
        let spawnTimer = 0;

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 도로 애니메이션
            lineOffset += gameSpeed;
            if (lineOffset > 60) lineOffset = 0;
            drawRoad();

            // 부드러운 차량 이동 (Lerp)
            car.x += (car.targetX - car.x) * 0.15;
            
            // 화면 경계선 제한
            if (car.x < 20) { car.x = 20; car.targetX = 20; }
            if (car.x > canvas.width - car.width - 20) { car.x = canvas.width - car.width - 20; car.targetX = car.x; }

            drawCar(car.x, car.y, car.width, car.height);

            // 장애물 스폰
            spawnTimer += deltaTime;
            if (spawnTimer > (1500 - gameSpeed * 50)) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // 장애물 업데이트 및 그리기
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                // 플레이어 차와의 상대 속도 차이로 y값 증가
                obs.y += (gameSpeed - (obs.speed * 0.5));
                drawObstacle(obs);

                // 충돌 검사 (히트박스를 약간 작게 설정하여 관대하게 판정)
                const hitPadding = 5;
                if (car.x + hitPadding < obs.x + obs.width - hitPadding &&
                    car.x + car.width - hitPadding > obs.x + hitPadding &&
                    car.y + hitPadding < obs.y + obs.height - hitPadding &&
                    car.y + car.height - hitPadding > obs.y + hitPadding) {
                    
                    gameState = 'GAMEOVER';
                    createExplosion(car.x, car.y);
                }

                // 화면 밖으로 나간 장애물 제거
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // 게임 오버 연출 (파티클)
            if (gameState === 'GAMEOVER') {
                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.random() * 4 + 2, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                }
                ctx.globalAlpha = 1.0;

                setTimeout(() => {
                    finalScoreDisplay.innerText = Math.floor(score);
                    gameOverScreen.classList.remove('hidden');
                }, 500);
                return; // 루프 정지
            }

            // 점수 및 난이도 증가
            score += gameSpeed * 0.02;
            scoreDisplay.innerText = `SCORE: ${Math.floor(score)}`;
            
            if (gameSpeed < 18) {
                gameSpeed += 0.001; // 서서히 속도 증가
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // 키보드 컨트롤
        document.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            const moveAmt = canvas.width / 3; // 차선 하나 너비만큼 목표 설정
            
            if (e.key === 'ArrowLeft') {
                car.targetX -= moveAmt;
            } else if (e.key === 'ArrowRight') {
                car.targetX += moveAmt;
            }
        });

        // 터치/마우스 컨트롤 (화면 좌/우 터치 시 이동)
        canvas.addEventListener('mousedown', handleTouch);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 스크롤 방지
            handleTouch(e.touches[0]);
        }, { passive: false });

        function handleTouch(e) {
            if (gameState !== 'PLAYING') return;
            
            const rect = canvas.getBoundingClientRect();
            const touchX = (e.clientX || e.pageX) - rect.left;
            
            const moveAmt = canvas.width / 3;
            
            // 화면 왼쪽 클릭/터치
            if (touchX < canvas.width / 2) {
                car.targetX -= moveAmt;
            } 
            // 화면 오른쪽 클릭/터치
            else {
                car.targetX += moveAmt;
            }
        }

        // 버튼 이벤트
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        // 초기화
        resize();
        drawRoad();
        drawCar(canvas.width/2 - car.width/2, canvas.height - car.height - 40, car.width, car.height);

    </script>
</body>
</html>
